<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="favicon.jpg">
  <title>KGiotakos Portfolio</title>
  <style>

    :root {
      /* Background */
      --bg-color: #1a1b26;

      /* Header Text */
      --name-color: #c0caf5;
      --title-color: #bb9af7;

      /* Profile Picture */
      --pfp-border-color: #ff9e64;

      /* Buttons - Normal State */
      --btn-bg: #24283b;
      --btn-text: #c0caf5;
      --btn-border: #414868;

      /* Buttons - Hover State */
      --btn-hover-bg: #2f354d;
      --btn-hover-text: #ff9e64;
      --btn-hover-border: #ff9e64;

      --footer-text: #565f89;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-color);
      color: var(--name-color);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 1.5rem 1rem 1.5rem;
    }

    .wrapper {
      width: 100%;
      max-width: 1000px;
      margin: auto 0;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
    }

    .text-content {
      flex: 1;
    }

    .name {
      font-size: clamp(2.5rem, 8vw, 6.5rem);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.03em;
      text-transform: none;
      color: var(--name-color);
    }

    .title {
      margin-top: 1.2rem;
      font-size: clamp(1rem, 3vw, 2rem);
      font-weight: 600;
      color: var(--title-color);
      letter-spacing: 0.05em;
      text-transform: none;
    }

    .pfp {
      width: clamp(120px, 22vw, 220px);
      height: clamp(120px, 22vw, 220px);
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--pfp-border-color);
      flex-shrink: 0;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 3rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.8rem 1.6rem;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid var(--btn-border);
      transition: background-color 0.2s, border-color 0.2s, color 0.2s;
    }

    .btn:hover {
      background-color: var(--btn-hover-bg);
      border-color: var(--btn-hover-border);
      color: var(--btn-hover-text);
    }

    .footer {
      margin-top: 3rem;
      text-align: center;
      font-size: 0.875rem;
      color: var(--footer-text);
      width: 100%;
    }

    @media (max-width: 650px) {
      .header {
        flex-direction: column-reverse;
        align-items: flex-start;
      }

      .pfp {
        width: 130px;
        height: 130px;
      }

      .buttons {
        flex-direction: column;
        width: 100%;
      }

      .btn {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    
    <header class="header">
      <div class="text-content">
        <h1 class="name">
          KONSTANTINOS<br>
          GIOTAKOS
        </h1>
        <p class="title">Computer Science Student @ AUTh</p>
      </div>

      <img src="favicon.jpg" alt="Konstantinos Giotakos pfp" class="pfp">
    </header>

    <div class="buttons">
      <a href="https://instagram.com/kgiotakos" target="_blank" class="btn">Instagram</a>
      <a href="https://github.com/kongiotakos" target="_blank" class="btn">GitHub</a>
      <a href="mailto:kgiotakos@gmail.com" class="btn">kgiotakos@gmail.com</a>
    </div>

  </div>

  <footer class="footer">
    <p>&copy; 2026 Konstantinos Giotakos – kgiotakos.com – All rights reserved</p>
  </footer>

</body>
</html>
