<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KGiotakos - Πανελλαδικές</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Mega:wght@600;900&family=Public+Sans:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #31c4de;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: 'Public Sans', sans-serif;
            overflow-x: hidden;
        }

        .main-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 420px;
        }

        .card-container {
            background-color: #fce136;
            width: 100%;
            padding: 40px 25px;
            border: 4px solid #000000;
            box-shadow: 12px 12px 0px #000000;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .side-ribbon {
            background-color: #fce136;
            border: 4px solid #000000; 
            box-shadow: 8px 8px 0px #000000; 
            position: fixed;
            top: 0;
            height: 100vh;
            width: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .ribbon-left {
            left: 25%;
        }

        .ribbon-right {
            right: 25%;
        }

        .side-ribbon span {
            font-family: 'Lexend Mega', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            color: #000000;
            writing-mode: vertical-rl;
            white-space: nowrap;
            letter-spacing: 4px;
            display: inline-block;
        }

        .ribbon-left span {
            transform: rotate(180deg); 
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px auto;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #000000;
            object-fit: cover;
            background-color: #fff;
        }

        h1 {
            font-family: 'Lexend Mega', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            color: #000000;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .bio {
            font-size: 0.95rem;
            font-weight: 600;
            color: #000000;
            margin-bottom: 4px;
        }

        .bio-sub {
            font-size: 0.95rem;
            font-weight: 600;
            color: #000000;
            margin-bottom: 25px;
        }

        .newspaper-container {
            width: 100%;
            height: 450px;
            border: 4px solid #000000;
            box-shadow: 6px 6px 0px #000000;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            background-color: #fff;
            margin-bottom: 8px;
        }

        .newspaper-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: 100% 62%; 
        }

        .newspaper-container.zoomed .newspaper-img {
            transform: scale(4.8);
        }

        .source-link {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            font-style: italic;
            color: #000000;
            text-decoration: none;
            margin-bottom: 20px;
            transition: opacity 0.2s ease;
        }

        .source-link:hover {
            opacity: 0.7;
        }

        .back-btn {
            display: block;
            padding: 16px;
            color: #000000;
            text-decoration: none;
            font-family: 'Lexend Mega', sans-serif;
            font-size: 0.95rem;
            font-weight: 900;
            background-color: #ff5e6c;
            border: 4px solid #000000;
            box-shadow: 0px 6px 0px #000000;
            transition: transform 0.05s ease, box-shadow 0.05s ease;
            letter-spacing: -0.5px;
        }

        .back-btn:active {
            transform: translateY(6px);
            box-shadow: 0px 0px 0px #000000;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0px 8px 0px #000000;
        }

        @media (max-width: 1024px) {
            .side-ribbon {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="side-ribbon ribbon-left">
        <span>KGIOTAKOS.COM</span>
    </div>

    <div class="main-wrapper">
        <div class="card-container">
            <div class="avatar-container">
                <img src="https://github.com/kongiotakos.png" alt="Avatar" class="profile-img">
            </div>
            
            <h1>KONSTANTINOS GIOTAKOS</h1>
            <p class="bio"><strong>ΑΡΙΣΤΟΥΧΟΣ</strong> στο Ν. Καρδίτσας</p>
            <p class="bio-sub"><strong>18.35</strong> Μ.Ο. | <strong>18.320</strong> Μόρια</p>

            <div class="newspaper-container" id="newspaperContainer">
                <img 
                    src="aristouxoi.JPG" 
                    alt="Αριστούχοι Ν. Καρδίτσας" 
                    id="newspaperImg"
                    class="newspaper-img"
                >
            </div>

            <a href="https://neosagon.gr/a27-chamogela-epitychias-apo-tous-aristouchous-ton-gel-tou-n-karditsas-stis-panelladikes/" target="_blank" rel="noopener noreferrer" class="source-link">
                Πηγή: Νέος Αγώνας 🔗
            </a>

            <a href="index.html" class="back-btn">ΠΙΣΩ ⬅️</a>
        </div>
    </div>

    <div class="side-ribbon ribbon-right">
        <span>PORTFOLIO 2026</span>
    </div>

    <script>
        const container = document.getElementById('newspaperContainer');

        const autoZoomTimeout = setTimeout(() => {
            container.classList.add('zoomed');
        }, 3000);

        container.addEventListener('mouseenter', () => {
            clearTimeout(autoZoomTimeout);
            container.classList.add('zoomed');
        });

        container.addEventListener('mouseleave', () => {
            container.classList.remove('zoomed');
        });
    </script>

</body>
</html>
